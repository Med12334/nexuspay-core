version: '3.8'

services:
  postgres-modern:
    image: postgres:16-alpine
    container_name: nexuspay-postgres
    environment:
      POSTGRES_USER: nexus_admin
      POSTGRES_PASSWORD: nexus_password
      POSTGRES_DB: nexus_accounts_db
    ports:
      - "5432:5432"
    volumes:
      - ./sql/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql

  ibm-db2-legacy:
    image: icr.io/db2_community/db2:latest
    container_name: nexuspay-db2
    privileged: true
    environment:
      LICENSE: accept
      DB2INST1_PASSWORD: db2_password
      DBNAME: LEGACYDB
    ports:
      - "50000:50000"

  kafka:
    image: bitnami/kafka:3.7
    container_name: nexuspay-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nexuspay-kafka-ui
    ports:
      - "8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: nexuspay-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
