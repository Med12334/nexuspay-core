server:
  port: 8000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: account-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/accounts/**
        - id: legacy-db2-bridge
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/db2-ledger/**
        - id: transaction-orchestrator
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/transactions/**
        - id: fraud-engine
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/fraud-alerts/**
